<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GLICOMETER — Mockup do ecrã ILI9341 480×320</title>
<style>
  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: #2b2c30;
    color: #e8e8e6;
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 34px 18px;
  }

  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ---------- Dispositivo (corpo de porcelana) ---------- */
  .device {
    position: relative;
    width: 572px;            /* 480 (ecrã) + 2×46 (molduras laterais) */
    padding: 26px 46px;
    background: linear-gradient(180deg, #fcfcfa 0%, #f1f1ed 62%, #ebebe6 100%);
    border-radius: 38px;
    box-shadow:
      0 34px 64px -22px rgba(0, 0, 0, .6),
      0 8px 18px -10px rgba(0, 0, 0, .35),
      inset 0 1px 0 rgba(255, 255, 255, .95),
      inset 0 -3px 8px rgba(0, 0, 0, .07);
  }

  /* Canelado (riscas verticais) nas laterais do corpo */
  .flute {
    position: absolute;
    top: 26px;
    bottom: 26px;
    width: 26px;
    border-radius: 14px;
    background:
      repeating-linear-gradient(
        90deg,
        rgba(20, 20, 20, .075) 0 1px,
        rgba(255, 255, 255, .95) 1px 4px,
        rgba(20, 20, 20, .045) 4px 5px,
        rgba(255, 255, 255, .80) 5px 8px
      );
    box-shadow:
      inset 0 0 7px rgba(0, 0, 0, .12),
      0 1px 0 rgba(255, 255, 255, .85);
  }
  .flute-l { left: 12px; }
  .flute-r { right: 12px; }

  /* Moldura em volta do ecrã */
  .frame {
    padding: 9px;
    background: #e8e8e4;
    border-radius: 26px;
    box-shadow:
      inset 0 1px 3px rgba(0, 0, 0, .20),
      0 1px 0 rgba(255, 255, 255, .9);
  }

  /* ---------- Ecrã ---------- */
  .screen {
    position: relative;
    width: 480px;
    height: 320px;
    background: #0c0d0f;
    border-radius: 17px;
    padding: 12px 20px 16px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow:
      inset 0 0 0 1px rgba(255, 255, 255, .05),
      inset 0 0 26px rgba(0, 0, 0, .6);
  }

  .status {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 7px;
    font-size: 10.5px;
    font-weight: 500;
    letter-spacing: .55px;
    color: #74797f;
  }
  .status .sep { color: #3c4046; }
  .status .dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #3fd39a;
    box-shadow: 0 0 6px rgba(63, 211, 154, .55);
    margin-right: 1px;
  }

  .content {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    align-items: center;
    gap: 10px;
    padding-top: 2px;
  }

  /* ---------- Bloco esquerdo: relógio + data + tempo ---------- */
  .left { padding-left: 4px; }

  .clock {
    font-size: 62px;
    font-weight: 300;
    line-height: 1;
    letter-spacing: -2.5px;
    color: #f6f6f4;
    font-variant-numeric: tabular-nums;
  }

  .date {
    margin-top: 10px;
    font-size: 13.5px;
    font-weight: 400;
    letter-spacing: .2px;
    color: #8b9095;
  }

  .weather {
    margin-top: 22px;
    display: flex;
    align-items: center;
    gap: 11px;
  }
  .wx-icon { flex: none; width: 30px; height: 30px; display: block; }
  .wx-temp {
    font-size: 19px;
    font-weight: 600;
    letter-spacing: -.2px;
    color: #ececeb;
    line-height: 1.1;
  }
  .wx-cond {
    font-size: 11.5px;
    color: #9aa0a6;
    margin-top: 3px;
  }
  .wx-loc {
    font-size: 10.5px;
    letter-spacing: .6px;
    color: #666b71;
    margin-top: 6px;
    text-transform: uppercase;
  }

  /* ---------- Bloco direito: anel de glucose ---------- */
  .right {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 7px;
  }

  .ring-label {
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 2.8px;
    color: #767b81;
  }

  .ring-wrap {
    position: relative;
    width: 150px;
    height: 150px;
  }
  .ring-wrap svg { display: block; }
  .ring-progress {
    filter: drop-shadow(0 0 5px rgba(63, 211, 154, .35));
  }

  .ring-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .ring-value {
    font-size: 38px;
    font-weight: 600;
    line-height: 1;
    letter-spacing: -1.2px;
    color: #f6f6f4;
    font-variant-numeric: tabular-nums;
  }
  .ring-unit {
    margin-top: 6px;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 1.4px;
    color: #8b9095;
  }

  .ring-status {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-top: 3px;
  }
  .ring-status .txt {
    font-size: 11.5px;
    font-weight: 500;
    letter-spacing: .2px;
    color: #3fd39a;
  }
  .ring-status svg { display: block; }

  /* ---------- Legenda fora do dispositivo ---------- */
  .legend {
    margin: 22px 0 0;
    font-size: 12.5px;
    letter-spacing: .3px;
    color: #787d84;
  }

  @media (max-height: 620px) {
    body { padding: 16px; }
    .device { transform: scale(.88); }
    .legend { margin-top: 6px; }
  }
</style>
</head>
<body>
  <main class="stage">
    <div class="device">
      <div class="flute flute-l" aria-hidden="true"></div>
      <div class="flute flute-r" aria-hidden="true"></div>

      <div class="frame">
        <div class="screen">

          <div class="status">
            <span class="dot" aria-hidden="true"></span>
            <span>G7</span>
            <span class="sep">·</span>
            <span>Ligado</span>
            <span class="sep">·</span>
            <span>87%</span>
          </div>

          <div class="content">

            <!-- ESQUERDA: relógio, data, tempo -->
            <section class="left">
              <div class="clock">10:24</div>
              <div class="date">Tuesday, 8 October</div>

              <div class="weather">
                <svg class="wx-icon" viewBox="0 0 32 32" aria-hidden="true">
                  <g stroke="#f5b942" stroke-width="1.7" stroke-linecap="round">
                    <path d="M11 4.6V2.4"/>
                    <path d="M4.6 11H2.4"/>
                    <path d="M6.4 6.4 4.9 4.9"/>
                    <path d="M15.6 6.4 17.1 4.9"/>
                  </g>
                  <circle cx="11" cy="11" r="5" fill="#f5b942"/>
                  <g fill="#d6dbdf">
                    <circle cx="13.5" cy="19.5" r="5"/>
                    <circle cx="20" cy="17.5" r="6.6"/>
                    <circle cx="25" cy="20.5" r="5"/>
                    <rect x="12.5" y="20.5" width="14" height="5" rx="2.5"/>
                  </g>
                </svg>
                <div>
                  <div class="wx-temp">18°C</div>
                  <div class="wx-cond">Partly Cloudy</div>
                  <div class="wx-loc">Lisboa</div>
                </div>
              </div>
            </section>

            <!-- DIREITA: anel de progresso da glucose -->
            <section class="right">
              <div class="ring-label">GLUCOSE</div>

              <div class="ring-wrap">
                <svg width="150" height="150" viewBox="0 0 150 150" aria-hidden="true">
                  <circle cx="75" cy="75" r="68"
                          fill="none" stroke="rgba(255,255,255,0.07)"
                          stroke-width="10"/>
                  <circle class="ring-progress" cx="75" cy="75" r="68"
                          fill="none" stroke="#3fd39a"
                          stroke-width="10" stroke-linecap="round"
                          stroke-dasharray="320.4 427.3"
                          transform="rotate(-90 75 75)"/>
                </svg>
                <div class="ring-center">
                  <div class="ring-value">132</div>
                  <div class="ring-unit">mg/dL</div>
                </div>
              </div>

              <div class="ring-status">
                <svg width="30" height="10" viewBox="0 0 30 10" fill="none" aria-hidden="true">
                  <path d="M1 5h24m0 0-4.4-4.4M25 5l-4.4 4.4"
                        stroke="#3fd39a" stroke-width="1.6"
                        stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span class="txt">Within Target Range</span>
              </div>
            </section>

          </div>
        </div>
      </div>
    </div>

    <p class="legend">Mockup — layout do ecrã ILI9341 480×320</p>
  </main>
</body>
</html>
