; Sinalizador de Glucose - firmware ESP32
; Bedside accessory built from a Dexcom G7 stream.
;
; This is an INFORMATORY accessory. It is NOT a certified medical device.
; Never make treatment decisions from this device alone - use the Dexcom
; receiver / phone app as the primary source of truth.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    bodmer/TFT_eSPI@^2.5.34
    bblanchon/ArduinoJson@^6.21.5
    adafruit/Adafruit NeoPixel@^1.12.0

; TFT_eSPI is configured entirely via build_flags so no User_Setup.h edit
; is needed. Default driver = ILI9488 3.5" 480x320.
; If your module is an ILI9341, swap ST7789_DRIVER -> ILI9341_DRIVER and
; keep TFT_WIDTH=320 / TFT_HEIGHT=480 (see firmware/README.md).
build_flags =
    -D USER_SETUP_LOADED=1
    ; ---- driver ----
    -D ILI9488_DRIVER=1
    -D TFT_WIDTH=320
    -D TFT_HEIGHT=480
    ; ---- pins (ESP32-WROOM) ----
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=4
    ; ---- fonts / rendering ----
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=40000000
